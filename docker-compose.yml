version: "3.9"

services:
  promptforge:
    build:
      context: .
    image: promptforge:local
    ports:
      - "5000:5000"
    environment:
      - FLASK_DEBUG=0
      - PORT=5000
    volumes:
      - ./images:/app/images
      - ./STYLES.json:/app/STYLES.json
      - ./CAMERA.json:/app/CAMERA.json
      - ./LIGHTS.json:/app/LIGHTS.json
      - ./THEMES.json:/app/THEMES.json
      - ./MATERIALS.json:/app/MATERIALS.json
    restart: unless-stopped
